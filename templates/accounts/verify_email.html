<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email | Multibank AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050018;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 400px;
            padding: 35px;
            background: #0B081E;
            border: 1px solid #241C48;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 217, 255, 0.12);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
            line-height: 1.6;
        }

        .email {
            color: #00D9FF;
            word-break: break-word;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid #352A62;
            background: #111022;
            color: white;
            text-align: center;
            font-size: 20px;
            letter-spacing: 5px;
            outline: none;
        }

        input:focus {
            border-color: #00D9FF;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(
                90deg,
                #00D9FF,
                #7C3AED
            );
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .resend {
            display: inline-block;
            margin-top: 20px;
            color: #00D9FF;
            text-decoration: none;
        }

        .resend:hover {
            text-decoration: underline;
        }

        .message {
            margin-bottom: 15px;
            color: #00D9FF;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">📧</div>

    <h1>Verify Your Email</h1>

    <p>
        We sent a 6-digit verification OTP to:
    </p>

    <p class="email">
        {{ request.user.email }}
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input
            type="text"
            name="otp"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            placeholder="000000"
            required
        >

        <button type="submit">
            Verify Email
        </button>
    </form>

    <a
        href="{% url 'resend_email_otp' %}"
        class="resend"
    >
        Resend OTP
    </a>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MultiBank AI - Reset Password</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            color: white;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(0,217,255,0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(123,44,255,0.10),
                    transparent 30%
                ),
                #071426;
        }


        .card {

            width: 100%;

            max-width: 450px;

            padding: 40px;

            background: #0B081E;

            border: 1px solid #263653;

            border-radius: 22px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.35);
        }


        .logo {

            width: 62px;

            height: 62px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #00D9FF,
                    #7B2CFF
                );

            font-size: 22px;

            font-weight: bold;
        }


        h1 {

            text-align: center;

            font-size: 28px;

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color: #A7A3C2;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }


        .messages {

            margin-bottom: 18px;
        }


        .message {

            background: #15152B;

            border: 1px solid #343452;

            padding: 11px;

            border-radius: 8px;

            font-size: 13px;

            margin-bottom: 7px;
        }


        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            color: #E5E3EF;

            font-size: 13px;

            margin-bottom: 8px;
        }


        input {

            width: 100%;

            padding: 14px;

            background: #080F1D;

            border: 1px solid #263653;

            border-radius: 9px;

            color: white;

            outline: none;

            font-size: 14px;
        }


        input:focus {

            border-color: #00D9FF;

            box-shadow:
                0 0 0 2px
                rgba(0,217,255,0.08);
        }


        input::placeholder {

            color: #626B7D;
        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #00D9FF,
                    #7B2CFF
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(0,217,255,0.20);
        }


        .back {

            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #A7A3C2;
        }


        .back a {

            color: #00D9FF;

            text-decoration: none;

            font-weight: 600;
        }


        .security {

            text-align: center;

            margin-top: 20px;

            color: #687286;

            font-size: 11px;
        }


        .security span {

            color: #00D9FF;
        }

    </style>

</head>


<body>


<div class="card">


    <div class="logo">
        AI
    </div>


    <h1>
        Reset Password
    </h1>


    <p class="subtitle">

        Enter the OTP sent to your email
        and create a new password.

    </p>


    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <!-- OTP -->

        <div class="form-group">

            <label for="otp">
                Verification OTP
            </label>

            <input
                type="text"
                id="otp"
                name="otp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                inputmode="numeric"
                autocomplete="off"
                required
            >

        </div>


        <!-- NEW PASSWORD -->

        <div class="form-group">

            <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter new password"
                autocomplete="new-password"
                required
            >

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                autocomplete="new-password"
                required
            >

        </div>


        <button type="submit">

            Reset Password

        </button>


    </form>


    <div class="back">

        Remember your password?

        <a href="{% url 'login' %}">
            Back to Login
        </a>

    </div>


    <div class="security">

        <span>🔒</span>

        Your password is securely encrypted

    </div>


</div>


</body>

</html>
